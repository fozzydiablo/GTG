<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>GTG — Workout Tracker</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo-dot"></span>
          <span class="brand-name">GTG</span>
          <span class="brand-sub">Get To Gym</span>
        </div>
        <nav class="tabs">
          <button class="tab" data-route="today">Today</button>
          <button class="tab" data-route="exercises">Exercises</button>
          <button class="tab" data-route="history">History</button>
          <button class="tab" data-route="goal">Goal</button>
        </nav>
      </header>
      <main id="view"></main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
