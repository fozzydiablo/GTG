<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="description" content="Sleek workout tracker with stick-figure exercise animations. Built for upper-body strength and benching 135." />

    <title>GTG — Workout Tracker</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GTG" />
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="logo-dot"></span>
          <span class="brand-name">GTG</span>
          <span class="brand-sub">Get To Gym</span>
        </div>
        <nav class="tabs">
          <button class="tab" data-route="today">Today</button>
          <button class="tab" data-route="exercises">Exercises</button>
          <button class="tab" data-route="history">History</button>
          <button class="tab" data-route="goal">Goal</button>
        </nav>
        <button id="install-btn" class="btn primary install-btn" hidden>Install App</button>
      </header>
      <main id="view"></main>
      <div id="update-toast" class="toast" hidden>
        <span>New version available</span>
        <button class="btn primary" id="update-btn">Reload</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
