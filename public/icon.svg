<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11151f"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#88f5d1"/>
      <stop offset="100%" stop-color="#4ad6a3"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Stick figure pressing a barbell, abstract -->
  <g stroke="url(#mark)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)">
    <!-- Barbell -->
    <line x1="120" y1="180" x2="392" y2="180"/>
    <!-- Plates -->
    <rect x="98" y="148" width="22" height="64" rx="6" fill="url(#mark)" stroke="none"/>
    <rect x="392" y="148" width="22" height="64" rx="6" fill="url(#mark)" stroke="none"/>
    <!-- Arms -->
    <line x1="180" y1="180" x2="200" y2="240"/>
    <line x1="332" y1="180" x2="312" y2="240"/>
    <line x1="200" y1="240" x2="216" y2="300"/>
    <line x1="312" y1="240" x2="296" y2="300"/>
    <!-- Torso -->
    <line x1="216" y1="300" x2="256" y2="328"/>
    <line x1="296" y1="300" x2="256" y2="328"/>
    <line x1="256" y1="328" x2="256" y2="396"/>
    <!-- Head -->
    <circle cx="256" cy="118" r="34" fill="url(#mark)" stroke="none"/>
  </g>
</svg>
